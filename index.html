<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff9ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Senior Fraud Shield" />
  <meta name="description" content="Senior Fraud Shield / Honey Shield - Protecting elders against digital arrest scams in India" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/shield-icon.svg" />
  <title>Senior Fraud Shield | Honey Shield</title>
  
  <!-- Google Fonts: Nunito Sans & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: #fff9ef;
        font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #1e1b14;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
      }
      .pt-safe {
        padding-top: max(env(safe-area-inset-top, 0px), 12px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
    /* Ensure all text for elderly is high contrast and legible */
    * {
      touch-action: manipulation;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
